<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Live Health Monitor</title>

  <!-- Bootstrap / Icons / Chart.js -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background:#f4f6f9; }
    .card { border-radius:1rem; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .title-icon { margin-right:.5rem; color:#0d6efd; }
    .value { font-size:1.4rem; font-weight:bold; }

    /* ECG: fixed compact height (no scrolling) */
    .ecg-wrap { height:220px; max-height:40vh; }
    #ecgChart { width:100% !important; height:100% !important; display:block; }
    @media (max-width:576px){ .ecg-wrap{ height:180px; } }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-5 text-primary">Live Health Monitoring Dashboard</h1>

    <div class="row g-4 mb-4">
      <!-- Oximeter -->
      <div class="col-md-4">
        <div class="card p-4">
          <h5><i class="fas fa-lungs title-icon"></i>Oximeter</h5>
          <p>Heart Rate: <span id="heart" class="value">--</span> bpm</p>
          <p>Oxygen Level: <span id="oxygen" class="value">--</span> %</p>
        </div>
      </div>

      <!-- Temperature -->
      <div class="col-md-4">
        <div class="card p-4">
          <h5><i class="fas fa-thermometer-half title-icon"></i>Temperature</h5>
          <p>Body Temp: <span id="temp" class="value">--</span> °C</p>
        </div>
      </div>

      <!-- Fall Detection -->
      <div class="col-md-4">
        <div class="card p-4">
          <h5><i class="fas fa-user-injured title-icon"></i>Fall Detection</h5>
          <p>Status: <span id="fall" class="value">--</span></p>
          <p>Sensor Status: <span id="fallOrigin" class="value">--</span></p>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <!-- GPS -->
      <div class="col-md-6">
        <div class="card p-4">
          <h5><i class="fas fa-map-marker-alt title-icon"></i>GPS Location</h5>
          <p><strong>Coordinates:</strong> <span id="gps" class="value">--</span></p>
          <p><strong>Place:</strong> <span id="place" class="value text-primary">Detecting...</span></p>
        </div>
      </div>

      <!-- ECG Chart -->
      <div class="col-md-6">
        <div class="card p-3">
          <h5><i class="fas fa-heartbeat title-icon"></i>ECG Signal (Live)</h5>
          <div class="ecg-wrap">
            <canvas id="ecgChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Live Update Script (ONLY uses data.ecg_value) -->
  <script>
  // --- helpers ---
  const setText = (id, v) => (document.getElementById(id).textContent = v);

  // --- Chart.js: draw raw samples, no interpolation ---
  const ecgCtx = document.getElementById("ecgChart").getContext("2d");

  const ecgChart = new Chart(ecgCtx, {
    type: "line",
    data: { datasets: [{ data: [], parsing: false, borderColor: "crimson",
                         borderWidth: 2, pointRadius: 0, fill: false, tension: 0 }] },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, decimation: { enabled: false } },
      scales: {
        x: { type: "linear", min: 0, max: 6, grid: { color: "rgba(0,0,0,0.08)" },
             ticks: { callback: v => v.toFixed(0) + "s" } },
        // Set the same amplitude window you see on Arduino (adjust if needed)
        y: { min: -200, max: 200, grid: { color: "rgba(0,0,0,0.08)" } }
      }
    }
  });

  // rolling window state
  let FS = 600;         // will read from data.ecg.fs
  let t  = 0;           // seconds
  const WIN_SEC = 6;    // visible window
  const points = ecgChart.data.datasets[0].data; // array of {x,y}

  function pushSamples(samples) {
    const n = samples.length >>> 0;
    if (!n) return;
    for (let i = 0; i < n; i++) {
      t += 1 / FS;
      points.push({ x: t, y: Number(samples[i]) });
    }
    // trim to rolling window
    const oldest = t - WIN_SEC;
    while (points.length && points[0].x < oldest) points.shift();
    ecgChart.options.scales.x.min = oldest;
    ecgChart.options.scales.x.max = t;
    ecgChart.update("none");
  }

  async function fetchData() {
    try {
      const res = await fetch("/data");
      const data = await res.json();

      // text widgets (unchanged)
      setText("heart", data.heart_rate ?? "--");
      setText("oxygen", data.oxygen_level ?? "--");
      setText("temp", data.temperature ?? "--");
      setText("fall", data.fall_detected ? "Detected" : "None");
      setText("fallOrigin", data?.meta?.source ?? "--");
      if (data.gps) {
        setText("gps", `${Number(data.gps.lat ?? 0).toFixed(5)}, ${Number(data.gps.lon ?? 0).toFixed(5)}`);
        setText("place", data.gps.place || "Unknown");
      }

      // ---- the important part ----
      if (data?.ecg?.fs) FS = Number(data.ecg.fs) || FS;
      if (Array.isArray(data?.ecg?.samples) && data.ecg.samples.length) {
        pushSamples(data.ecg.samples);        // draw raw 400 Hz samples
      } else if (typeof data.ecg_value !== "undefined") {
        // fallback: single sample (won't be identical to Arduino)
        pushSamples([Number(data.ecg_value)]);
      }
    } catch (e) {
      console.error("fetch /data failed:", e);
    }
  }

  // poll every ~300 ms to match your POST cadence
  setInterval(fetchData, 200);
  fetchData();
</script>
</body>
</html>

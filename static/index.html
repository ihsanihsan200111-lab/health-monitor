<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Live Health Monitor</title>

  <!-- Bootstrap / Icons / Chart.js -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { background:#f4f6f9; }
    .card { border-radius:1rem; box-shadow:0 2px 8px rgba(0,0,0,.05); }
    .title-icon { margin-right:.5rem; color:#0d6efd; }
    .value { font-size:1.4rem; font-weight:bold; }

    /* ECG: fixed compact height (no scrolling) */
    .ecg-wrap { height:220px; max-height:40vh; }
    #ecgChart { width:100% !important; height:100% !important; display:block; }
    @media (max-width:576px){ .ecg-wrap{ height:180px; } }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-5 text-primary">Live Health Monitoring Dashboard</h1>

    <div class="row g-4 mb-4">
      <!-- Oximeter -->
      <div class="col-md-4">
        <div class="card p-4">
          <h5><i class="fas fa-lungs title-icon"></i>Oximeter</h5>
          <p>Heart Rate: <span id="heart" class="value">--</span> bpm</p>
          <p>Oxygen Level: <span id="oxygen" class="value">--</span> %</p>
        </div>
      </div>

      <!-- Temperature -->
      <div class="col-md-4">
        <div class="card p-4">
          <h5><i class="fas fa-thermometer-half title-icon"></i>Temperature</h5>
          <p>Body Temp: <span id="temp" class="value">--</span> °C</p>
        </div>
      </div>

      <!-- Fall Detection -->
      <div class="col-md-4">
        <div class="card p-4">
          <h5><i class="fas fa-user-injured title-icon"></i>Fall Detection</h5>
          <p>Status: <span id="fall" class="value">--</span></p>
          <p>Sensor Status: <span id="fallOrigin" class="value">--</span></p>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <!-- GPS -->
      <div class="col-md-6">
        <div class="card p-4">
          <h5><i class="fas fa-map-marker-alt title-icon"></i>GPS Location</h5>
          <p><strong>Coordinates:</strong> <span id="gps" class="value">--</span></p>
          <p><strong>Place:</strong> <span id="place" class="value text-primary">Detecting...</span></p>
        </div>
      </div>

      <!-- ECG Chart -->
      <div class="col-md-6">
        <div class="card p-3">
          <h5><i class="fas fa-heartbeat title-icon"></i>ECG Signal (Live)</h5>
          <div class="ecg-wrap">
            <canvas id="ecgChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Live Update Script (ONLY uses data.ecg_value) -->
  <script>
    // --- helpers ---
    const setText = (id, v) => (document.getElementById(id).textContent = v);

    // --- Chart.js setup ---
    const ecgCtx = document.getElementById("ecgChart").getContext("2d");

    // Pretty gradient + subtle fill
    const strokeGrad = ecgCtx.createLinearGradient(0, 0, 0, ecgCtx.canvas.height);
    strokeGrad.addColorStop(0.00, "rgba(220,20,60,1)");
    strokeGrad.addColorStop(1.00, "rgba(220,20,60,0.75)");
    const fillGrad = ecgCtx.createLinearGradient(0, 0, 0, ecgCtx.canvas.height);
    fillGrad.addColorStop(0.00, "rgba(220,20,60,0.12)");
    fillGrad.addColorStop(1.00, "rgba(220,20,60,0)");

    // ECG-paper style grid (minor 1mm, major 5mm)
    const ecgGrid = {
      id: "ecgGrid",
      beforeDraw(chart) {
        const { ctx, chartArea: a } = chart;
        ctx.save();
        ctx.clearRect(a.left, a.top, a.width, a.height);
        // minor
        ctx.beginPath(); ctx.strokeStyle = "rgba(255,99,132,0.08)"; ctx.lineWidth = 1;
        for (let x = a.left; x <= a.right; x += 5) { ctx.moveTo(x, a.top); ctx.lineTo(x, a.bottom); }
        for (let y = a.top; y <= a.bottom; y += 5) { ctx.moveTo(a.left, y); ctx.lineTo(a.right, y); }
        ctx.stroke();
        // major
        ctx.beginPath(); ctx.strokeStyle = "rgba(255,99,132,0.18)"; ctx.lineWidth = 1.25;
        for (let x = a.left; x <= a.right; x += 25) { ctx.moveTo(x, a.top); ctx.lineTo(x, a.bottom); }
        for (let y = a.top; y <= a.bottom; y += 25) { ctx.moveTo(a.left, y); ctx.lineTo(a.right, y); }
        ctx.stroke();
        ctx.restore();
      }
    };

    // Soft glow for the trace
    const glow = {
      id: "glow",
      beforeDatasetsDraw(chart) {
        const ctx = chart.ctx;
        ctx.save();
        ctx.shadowColor = "rgba(220,20,60,0.35)";
        ctx.shadowBlur = 8;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
      },
      afterDatasetsDraw(chart) { chart.ctx.restore(); }
    };

    // Rolling window with visual interpolation (ONLY ecg_value)
    const WIN_SEC  = 6;      // visible window in seconds
    const VIZ_FS   = 120;    // client-side visual sampling Hz
    const DRAW_FPS = 30;     // chart refresh rate
    const TAU_S    = 0.12;   // smoothing time-constant (smaller = spikier)

    let t = 0;               // time in seconds
    let target = 0;          // latest ecg_value from server
    let current = 0;         // rendered value (eases toward target)
    let lastSampleMs = performance.now();
    let lastDrawMs   = 0;

    // Gentle auto-scale
    let yMin = -600, yMax = 600;

    const points = []; // {x, y}

    function updateYScale() {
      if (!points.length) return;
      let lo = Infinity, hi = -Infinity;
      for (const p of points) { if (p.y < lo) lo = p.y; if (p.y > hi) hi = p.y; }
      const span = Math.max(60, hi - lo);
      const pad  = Math.max(30, span * 0.25);
      let tgtMin = Math.max(-1000, Math.floor((lo - pad) / 50) * 50);
      let tgtMax = Math.min( 1000, Math.ceil ((hi + pad) / 50) * 50);
      const alpha = 0.25;
      yMin = yMin + alpha * (tgtMin - yMin);
      yMax = yMax + alpha * (tgtMax - yMax);
      ecgChart.options.scales.y.min = Math.round(yMin);
      ecgChart.options.scales.y.max = Math.round(yMax);
    }

    const ecgChart = new Chart(ecgCtx, {
      type: "line",
      data: {
        datasets: [{
          data: points,
          parsing: false,
          borderColor: strokeGrad,
          backgroundColor: fillGrad,
          borderWidth: 2,
          pointRadius: 0,            // no dots
          fill: true,
          spanGaps: true,
          cubicInterpolationMode: "monotone",
          tension: 0.25
        }]
      },
      options: {
        animation: false,
        responsive: true,
        maintainAspectRatio: false,   // respect .ecg-wrap height
        plugins: { legend: { display: false } },
        scales: {
          x: {
            type: "linear", min: 0, max: WIN_SEC,
            grid: { display: false },
            ticks: { callback: v => v.toFixed(0) + "s" }
          },
          y: {
            min: yMin, max: yMax,
            grid: { display: false }
          }
        }
      },
      plugins: [ecgGrid, glow]
    });

    function addVizSamples() {
      const now = performance.now();
      const need = Math.floor(((now - lastSampleMs) / 1000) * VIZ_FS);
      if (need <= 0) return;

      // exponential easing toward target
      const alpha = 1 - Math.exp(-(need / VIZ_FS) / TAU_S);
      for (let i = 0; i < need; i++) {
        current += alpha * (target - current);
        t += 1 / VIZ_FS;
        points.push({ x: t, y: current });
      }
      lastSampleMs += (need / VIZ_FS) * 1000;

      // trim to window
      const oldest = t - WIN_SEC;
      while (points.length && points[0].x < oldest) points.shift();

      // slide x-range
      ecgChart.options.scales.x.min = oldest;
      ecgChart.options.scales.x.max = t;
    }

    function loop() {
      addVizSamples();
      const now = performance.now();
      if (now - lastDrawMs >= (1000 / DRAW_FPS)) {
        updateYScale();
        ecgChart.update("none");
        lastDrawMs = now;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Poll ONLY ecg_value + vitals
    async function fetchData() {
      try {
        const res = await fetch("/data");
        const data = await res.json();

        setText("heart", data.heart_rate ?? "--");
        setText("oxygen", data.oxygen_level ?? "--");
        setText("temp", data.temperature ?? "--");
        setText("fall", data.fall_detected ? "Detected" : "None");
        const origin = data?.meta?.source ?? "--";
        setText("fallOrigin", origin);

        if (data.gps) {
          const lat = Number(data.gps.lat ?? 0).toFixed(5);
          const lon = Number(data.gps.lon ?? 0).toFixed(5);
          setText("gps", `${lat}, ${lon}`);
          setText("place", data.gps.place || "Unknown");
        }

        // ONLY ecg_value used
        if (typeof data.ecg_value !== "undefined") {
          target = Number(data.ecg_value) || 0;
        }
      } catch (e) {
        console.error("fetch /data failed:", e);
      }
    }

    // Match your server cadence (~300 ms)
    setInterval(fetchData, 300);
    fetchData();
  </script>
</body>
</html>

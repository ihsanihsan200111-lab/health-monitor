<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Health Monitor</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Chart.js for ECG -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background-color: #f4f6f9;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .title-icon {
      margin-right: 0.5rem;
      color: #0d6efd;
    }
    .value {
      font-size: 1.4rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-5 text-primary"> Live Health Monitoring Dashboard</h1>

    <div class="row g-4 mb-4">
      <!-- Oximeter -->
      <div class="col-md-4">
        <div class="card p-4">
          <h5><i class="fas fa-lungs title-icon"></i>Oximeter</h5>
          <p> Heart Rate: <span id="heart" class="value">--</span> bpm</p>
          <p> Oxygen Level: <span id="oxygen" class="value">--</span> %</p>
        </div>
      </div>

      <!-- Temperature -->
      <div class="col-md-4">
        <div class="card p-4">
          <h5><i class="fas fa-thermometer-half title-icon"></i>Temperature</h5>
          <p> Body Temp: <span id="temp" class="value">--</span> C</p>
        </div>
      </div>

      <!-- Fall Detection -->
      <div class="col-md-4">
        <div class="card p-4">
          <h5><i class="fas fa-user-injured title-icon"></i>Fall Detection</h5>
          <p> Status: <span id="fall" class="value">--</span></p>
          <p> Sensor Status: <span id="fallOrigin" class="value">--</span></p>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <!-- GPS -->
      <div class="col-md-6">
        <div class="card p-4">
          <h5><i class="fas fa-map-marker-alt title-icon"></i>GPS Location</h5>
          <p><strong>Coordinates:</strong> <span id="gps" class="value">--</span></p>
          <p><strong>Place:</strong> <span id="place" class="value text-primary">Detecting...</span></p>
        </div>
      </div>

      <!-- ECG Chart -->
      <div class="col-md-6">
        <div class="card p-4">
          <h5><i class="fas fa-heartbeat title-icon"></i>ECG Signal (Live)</h5>
          <canvas id="ecgChart" height="160"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- Live Update Script -->
 <script>
  // --- UI updates for vitals ---
  function setText(id, value) {
    document.getElementById(id).textContent = value;
  }

  // --- Chart.js setup: smooth ECG line, rolling time window, glow + gradient ---
  const ecgCtx = document.getElementById("ecgChart").getContext("2d");

  // Pretty gradient + glow shadow
  const strokeGrad = ecgCtx.createLinearGradient(0, 0, 0, ecgCtx.canvas.height);
  strokeGrad.addColorStop(0.00, "rgba(220,20,60,1)");   // crimson top
  strokeGrad.addColorStop(1.00, "rgba(220,20,60,0.7)");

  const fillGrad = ecgCtx.createLinearGradient(0, 0, 0, ecgCtx.canvas.height);
  fillGrad.addColorStop(0.00, "rgba(220,20,60,0.12)");
  fillGrad.addColorStop(1.00, "rgba(220,20,60,0)");

  const glow = {
    id: "glow",
    beforeDatasetsDraw(chart) {
      const ctx = chart.ctx;
      ctx.save();
      ctx.shadowColor = "rgba(220,20,60,0.35)";
      ctx.shadowBlur = 8;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
    },
    afterDatasetsDraw(chart) {
      chart.ctx.restore();
    }
  };

  // Rolling window configuration
  let FS = 100;              // will be updated from server (data.ecg.fs)
  let t = 0;                 // seconds (x-axis)
  let WIN_SEC = 6;           // seconds visible
  const points = [];         // {x, y}

  const ecgChart = new Chart(ecgCtx, {
    type: "line",
    data: {
      datasets: [{
        label: "ECG",
        data: points,         // array of {x, y}
        parsing: false,       // we provide x/y directly
        borderColor: strokeGrad,
        backgroundColor: fillGrad,
        borderWidth: 2,
        fill: true,
        spanGaps: true,
        cubicInterpolationMode: "monotone",
        pointRadius: 0,       // <— no dots
        tension: 0.25
      }]
    },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        decimation: { enabled: true, algorithm: "lttb" } // performance safety
      },
      scales: {
        x: {
          type: "linear",
          min: 0,
          max: WIN_SEC,
          grid: { color: "rgba(0,0,0,0.08)" },
          ticks: {
            callback: (v) => v.toFixed(0) + "s"
          }
        },
        y: {
          min: -1000,   // match your Pi-side clamp
          max:  1000,
          grid: { color: "rgba(0,0,0,0.08)" }
        }
      }
    },
    plugins: [glow]
  });

  function pushSamples(samples) {
    // samples: array of numbers
    for (let i = 0; i < samples.length; i++) {
      t += 1 / FS;
      points.push({ x: t, y: Number(samples[i]) });
    }
    // Trim to rolling window
    const oldest = t - WIN_SEC;
    while (points.length && points[0].x < oldest) points.shift();
    // Update x range
    ecgChart.options.scales.x.min = oldest;
    ecgChart.options.scales.x.max = t;
    ecgChart.update("none");
  }

  async function fetchData() {
    try {
      const response = await fetch("/data");
      const data = await response.json();

      // ----- Textual widgets -----
      setText("heart", data.heart_rate ?? "--");
      setText("oxygen", data.oxygen_level ?? "--");
      setText("temp", data.temperature ?? "--");
      setText("fall", data.fall_detected ? "Detected" : "None");

      // Your backend sends sensor status in meta.source — use that instead of fall_origin
      const origin = (data?.meta && data.meta.source) ? data.meta.source : "--";
      setText("fallOrigin", origin);

      if (data.gps) {
        const lat = Number(data.gps.lat ?? 0).toFixed(5);
        const lon = Number(data.gps.lon ?? 0).toFixed(5);
        setText("gps", `${lat}, ${lon}`);
        setText("place", data.gps.place || "Unknown");
      }

      // ----- ECG stream (smooth, continuous) -----
      if (data?.ecg?.fs) {
        FS = Number(data.ecg.fs) || FS;
      }
      let samples = [];
      if (Array.isArray(data?.ecg?.samples) && data.ecg.samples.length) {
        samples = data.ecg.samples;
      } else if (typeof data.ecg_value !== "undefined") {
        // Fallback: push one sample if chunk missing
        samples = [Number(data.ecg_value)];
      } else {
        // No data — keep line steady
        return;
      }
      pushSamples(samples);
    } catch (err) {
      console.error("Failed to fetch sensor data:", err);
    }
  }

  // Kick off polling
  // If your POST interval is 300ms and you send ~FS*0.3 samples each post,
  // this matches nicely.
  setInterval(fetchData, 300);
  fetchData();
</script>

</body>
</html>
